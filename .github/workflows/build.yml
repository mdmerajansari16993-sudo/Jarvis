name: Build Jarvis APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Generate Jarvis Android Project
      run: |
        mkdir -p app/src/main/java/com/jarvis/assistant
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/xml

        cat << 'EOF' > settings.gradle
        include ':app'
        rootProject.name = "Jarvis"
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.4'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.jarvis.assistant'
            compileSdk 34

            defaultConfig {
                applicationId "com.jarvis.assistant"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Jarvis</string>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeAllMask"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
            android:canPerformGestures="true"
            android:canRetrieveWindowContent="true"
            android:description="@string/app_name"
            android:notificationTimeout="100" />
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.CALL_PHONE" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />

            <application
                android:allowBackup="true"
                android:icon="@android:drawable/ic_dialog_info"
                android:label="@string/app_name"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".JarvisAccessibilityService"
                    android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.accessibilityservice.AccessibilityService" />
                    </intent-filter>
                    <meta-data
                        android:name="android.accessibilityservice"
                        android:resource="@xml/accessibility_service_config" />
                </service>

            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/java/com/jarvis/assistant/JarvisAccessibilityService.java
        package com.jarvis.assistant;

        import android.accessibilityservice.AccessibilityService;
        import android.os.Handler;
        import android.os.Looper;
        import android.view.accessibility.AccessibilityEvent;
        import android.view.accessibility.AccessibilityNodeInfo;
        import java.util.List;

        public class JarvisAccessibilityService extends AccessibilityService {
            public static JarvisAccessibilityService instance;
            private Handler actionHandler = new Handler(Looper.getMainLooper());
            private boolean isEmergencyStopped = false;

            @Override
            public void onServiceConnected() {
                super.onServiceConnected();
                instance = this;
                isEmergencyStopped = false;
            }

            @Override
            public void onAccessibilityEvent(AccessibilityEvent event) {}

            @Override
            public void onInterrupt() {
                instance = null;
            }

            public void emergencyStop() {
                isEmergencyStopped = true;
                actionHandler.removeCallbacksAndMessages(null);
            }

            public void stopCurrentAction() {
                actionHandler.removeCallbacksAndMessages(null);
            }

            public void resetSafety() {
                isEmergencyStopped = false;
            }

            public void autoClickSendButton() {
                if (isEmergencyStopped) return;
                actionHandler.postDelayed(() -> {
                    if (isEmergencyStopped) return;
                    AccessibilityNodeInfo rootNode = getRootInActiveWindow();
                    if (rootNode == null) return;

                    List<AccessibilityNodeInfo> sendButtons = rootNode.findAccessibilityNodeInfosByViewId("com.whatsapp:id/send");
                    if (sendButtons != null && !sendButtons.isEmpty()) {
                        sendButtons.get(0).performAction(AccessibilityNodeInfo.ACTION_CLICK);
                    } else {
                        List<AccessibilityNodeInfo> byText = rootNode.findAccessibilityNodeInfosByText("Send");
                        if (byText != null && !byText.isEmpty()) {
                            byText.get(0).performAction(AccessibilityNodeInfo.ACTION_CLICK);
                        }
                    }
                }, 1500);
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/jarvis/assistant/MainActivity.java
        package com.jarvis.assistant;

        import android.app.Activity;
        import android.content.Intent;
        import android.content.SharedPreferences;
        import android.net.Uri;
        import android.os.Bundle;
        import android.speech.RecognizerIntent;
        import android.speech.tts.TextToSpeech;
        import android.view.Gravity;
        import android.widget.Button;
        import android.widget.EditText;
        import android.widget.LinearLayout;
        import android.widget.ScrollView;
        import android.widget.TextView;
        import android.widget.Toast;
        import java.net.URLEncoder;
        import java.util.ArrayList;
        import java.util.Locale;

        public class MainActivity extends Activity {
            private TextToSpeech tts;
            private TextView statusText;
            private EditText etPapaNumber, etWhatsAppNumber;
            private SharedPreferences prefs;
            private static final int VOICE_REQUEST_CODE = 100;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                prefs = getSharedPreferences("JarvisPrefs", MODE_PRIVATE);

                ScrollView scrollView = new ScrollView(this);
                LinearLayout layout = new LinearLayout(this);
                layout.setOrientation(LinearLayout.VERTICAL);
                layout.setPadding(40, 40, 40, 40);

                TextView title = new TextView(this);
                title.setText("Jarvis Personal Assistant");
                title.setTextSize(22);
                title.setGravity(Gravity.CENTER);
                title.setPadding(0, 0, 0, 30);
                layout.addView(title);

                TextView tvPapa = new TextView(this);
                tvPapa.setText("पापा का फ़ोन नंबर:");
                layout.addView(tvPapa);

                etPapaNumber = new EditText(this);
                etPapaNumber.setHint("उदा. 9876543210");
                etPapaNumber.setText(prefs.getString("papa_num", ""));
                layout.addView(etPapaNumber);

                TextView tvWA = new TextView(this);
                tvWA.setText("WhatsApp दोस्त का नंबर (91 लगाकर):");
                layout.addView(tvWA);

                etWhatsAppNumber = new EditText(this);
                etWhatsAppNumber.setHint("उदा. 919876543210");
                etWhatsAppNumber.setText(prefs.getString("wa_num", ""));
                layout.addView(etWhatsAppNumber);

                Button btnSave = new Button(this);
                btnSave.setText("नंबर सेव करें (Save)");
                btnSave.setOnClickListener(v -> {
                    prefs.edit()
                        .putString("papa_num", etPapaNumber.getText().toString().trim())
                        .putString("wa_num", etWhatsAppNumber.getText().toString().trim())
                        .apply();
                    Toast.makeText(this, "नंबर सुरक्षित हो गए भाई!", Toast.LENGTH_SHORT).show();
                });
                layout.addView(btnSave);

                Button listenBtn = new Button(this);
                listenBtn.setText("🎙 Jarvis से बोलें (Mic On)");
                listenBtn.setPadding(0, 30, 0, 30);
                listenBtn.setOnClickListener(v -> startVoiceRecognition());
                layout.addView(listenBtn);

                statusText = new TextView(this);
                statusText.setText("स्थिति: Jarvis तैयार है...");
                statusText.setPadding(0, 20, 0, 0);
                layout.addView(statusText);

                scrollView.addView(layout);
                setContentView(scrollView);

                tts = new TextToSpeech(this, status -> {
                    if (status == TextToSpeech.SUCCESS) {
                        tts.setLanguage(new Locale("hi", "IN"));
                    }
                });
            }

            private void startVoiceRecognition() {
                Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN");
                intent.putExtra(RecognizerIntent.EXTRA_PROMPT, "भाई, क्या हुक्म है?");
                try {
                    startActivityForResult(intent, VOICE_REQUEST_CODE);
                } catch (Exception e) {
                    Toast.makeText(this, "माइक शुरू नहीं हुआ", Toast.LENGTH_SHORT).show();
                }
            }

            @Override
            protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                super.onActivityResult(requestCode, resultCode, data);
                if (requestCode == VOICE_REQUEST_CODE && resultCode == RESULT_OK && data != null) {
                    ArrayList<String> results = data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS);
                    if (results != null && !results.isEmpty()) {
                        String command = results.get(0).toLowerCase();
                        statusText.setText("सुना गया: " + command);
                        processCommand(command);
                    }
                }
            }

            private void processCommand(String text) {
                if (text.contains("जार्विस हेड") || text.contains("jarvis head") || text.contains("हेड स्टॉप") || text.contains("head stop")) {
                    if (JarvisAccessibilityService.instance != null) {
                        JarvisAccessibilityService.instance.emergencyStop();
                    }
                    speak("इमरजेंसी स्टॉप! सब काम तुरंत बंद कर दिया भाई।");
                    return;
                }

                if (text.contains("जार्विस स्टॉप") || text.contains("jarvis stop") || text.equals("स्टॉप") || text.equals("रुक जाओ")) {
                    if (JarvisAccessibilityService.instance != null) {
                        JarvisAccessibilityService.instance.stopCurrentAction();
                    }
                    speak("भाई क्यों रुकने के लिए बोला बताओ?");
                    return;
                }

                if (JarvisAccessibilityService.instance != null) {
                    JarvisAccessibilityService.instance.resetSafety();
                }

                if (text.contains("कॉल") || text.contains("call") || text.contains("पापा")) {
                    String pNum = prefs.getString("papa_num", "");
                    if (pNum.isEmpty()) {
                        speak("भाई, पहले ऐप खोलकर पापा का नंबर लिख दो।");
                    } else {
                        speak("जी भाई, पापा को कॉल लगा रहा हूँ");
                        makePhoneCall(pNum);
                    }
                    return;
                }

                if (text.contains("whatsapp") || text.contains("व्हाट्सएप") || text.contains("मैसेज")) {
                    String waNum = prefs.getString("wa_num", "");
                    if (waNum.isEmpty()) {
                        speak("भाई, पहले ऐप खोलकर व्हाट्सएप नंबर लिख दो।");
                    } else {
                        speak("जी भाई, WhatsApp पर मैसेज भेज रहा हूँ");
                        sendWhatsAppMessage(waNum, "भाई इधर आओ नजदीक की तरफ");
                    }
                    return;
                }

                speak("जी भाई, आपका हुक्म समझ गया।");
            }

            private void makePhoneCall(String phoneNumber) {
                try {
                    Intent callIntent = new Intent(Intent.ACTION_CALL);
                    callIntent.setData(Uri.parse("tel:" + phoneNumber));
                    startActivity(callIntent);
                } catch (Exception e) {
                    speak("कॉल लगाने की परमिशन नहीं मिली भाई");
                }
            }

            private void sendWhatsAppMessage(String phoneNumber, String message) {
                try {
                    String url = "https://api.whatsapp.com/send?phone=" + phoneNumber + "&text=" + URLEncoder.encode(message, "UTF-8");
                    Intent intent = new Intent(Intent.ACTION_VIEW);
                    intent.setData(Uri.parse(url));
                    intent.setPackage("com.whatsapp");
                    startActivity(intent);

                    if (JarvisAccessibilityService.instance != null) {
                        JarvisAccessibilityService.instance.autoClickSendButton();
                    }
                } catch (Exception e) {
                    speak("मैसेज भेजने में समस्या आई भाई");
                }
            }

            private void speak(String speech) {
                tts.speak(speech, TextToSpeech.QUEUE_FLUSH, null, null);
            }
        }
        EOF

    - name: Build APK with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-APK
        path: app/build/outputs/apk/debug/*.apk
